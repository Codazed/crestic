[tool.poetry]
name = "crestic"
version = "0.1.0"
description = "Configurable command invocation for restic"
authors = ["Joshua Luce <luce@codazed.dev>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
prettytable = "^3.16.0"

[tool.poetry.scripts]
crestic = "crestic.__main__:main"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
