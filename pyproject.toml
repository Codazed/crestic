[tool.poetry]
name = "crestic"
version = "0.1.0"
description = "Configurable command invocation for restic"
authors = ["Joshua Luce <luce@codazed.dev>"]
license = "AGPL-3.0-or-later"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
PyYAML = "^6.0.1"

[tool.poetry.scripts]
crestic = "crestic.cli:main"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
