[project]
name = "crestic"
description = "Configurable command invocation for restic"
authors = [{ name = "Joshua Luce", email = "luce@codazed.dev" }]
requires-python = "~=3.12.0"
readme = "README.md"
license = "MIT"
dependencies = ["typer>=0.16.0,<0.17"]
dynamic = ["version"]

[project.scripts]
crestic = "crestic.cli:app"

[dependency-groups]
dev = [
    "ruff==0.12.4",
]

[tool.hatch.build.targets.sdist]
include = ["config.example.toml"]

[tool.hatch.build.targets.wheel]
include = ["config.example.toml"]

[tool.hatch.version]
source = "vcs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
