[tool.poetry]
name = "crestic"
version = "0.1.0"
description = "Configurable command invocation for restic"
authors = ["Joshua Luce <luce@codazed.dev>"]
license = "MIT"
readme = "README.md"
include = [{ path = "config.example.toml", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = "^3.12"
prettytable = "^3.16.0"
typer = "^0.15.2"

[tool.poetry.scripts]
crestic = "crestic.cli:app"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
